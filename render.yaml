# Render.com деплой конфигурациясы
# https://render.com → New → Blueprint → осы репозиторийді таңдаңыз
services:
  - type: web
    name: kz-history-rpg
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true      # Render автоматты кездейсоқ мән жасайды
      - key: ADMIN_PASSWORD
        sync: false              # Render панелінде қолмен енгізіңіз
      - key: DB_DRIVER
        value: sqlite
      - key: SQLITE_FILE
        value: /var/data/game.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: game-data
      mountPath: /var/data
      sizeGB: 1
