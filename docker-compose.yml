services:
  app:
    build: .
    image: kz-history-rpg:latest
    container_name: kz-history-rpg
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      SQLITE_FILE: /app/server/database/data/game.db
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env файлында көрсетілуі керек}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Akilbek8080}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      HEARTS_PER_ROOM: ${HEARTS_PER_ROOM:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GOOGLE_SHEETS_ENABLED: ${GOOGLE_SHEETS_ENABLED:-false}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
    volumes:
      - game-data:/app/server/database/data
      - pdf-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PostgreSQL қолданғыңыз келсе: DB_DRIVER=postgres және мына сервисті қосыңыз
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: kzhistory
  #     POSTGRES_USER: kzhistory
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  game-data:
  pdf-uploads:
  # pg-data:
