# Fly.io деплой конфигурациясы
# fly launch --no-deploy  →  fly volumes create game_data --size 1  →  fly deploy
app = "kz-history-rpg"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SQLITE_FILE = "/data/game.db"
  UPLOADS_DIR = "/data/uploads"

[[mounts]]
  source = "game_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
